[project]
name = "nexo-u-backend"
version = "1.4.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "sqlalchemy>=2.0,<3",
    "pydantic>=2.8,<3",
    "pydantic-settings>=2.4,<3",
    "psycopg[binary]>=3.2,<4",
    "PyJWT>=2.9,<3",
    "argon2-cffi>=23.1,<26",
    "email-validator>=2.2,<3",
    "alembic>=1.13,<2",
    "httpx>=0.27,<1",
]

[tool.vercel]
entrypoint = "index:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
